<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png" />

<!--
  La sirve GitHub Pages cuando el link no existe. Va suelta, sin pasar por
  Vite y sin depender de los assets con hash: todo el estilo es de acá.
-->
<style>
  :root {
    --bg: #050c1f;
    --surface: #0b1532;
    --text: #ffffff;
    --text-2: rgba(255, 255, 255, .72);
    --text-3: rgba(255, 255, 255, .46);
    --line: rgba(255, 255, 255, .12);
    --accent: #0444E4;
    --accent-2: #5b8cff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text-2);
    font: 16px/1.6 "Inter", system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 48px 16px;
    position: relative;
    overflow-x: hidden;
  }
  /* el mismo resplandor azul de la home, pero quieto */
  body::before {
    content: "";
    position: fixed;
    inset: -30% -10% auto -10%;
    height: 70vh;
    background: radial-gradient(60% 60% at 50% 0%, rgba(4, 68, 228, .35), transparent 70%);
    pointer-events: none;
  }
  main { position: relative; width: 100%; max-width: 560px; text-align: center; }
  .logo { width: 148px; height: auto; margin: 0 auto 36px; display: block; }
  .code {
    display: inline-block;
    font: 500 13px/1 "JetBrains Mono", ui-monospace, Consolas, monospace;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 16px;
    margin-bottom: 22px;
  }
  h1 {
    font-family: "Montserrat", system-ui, "Segoe UI", sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 8vw, 46px);
    line-height: 1.08;
    letter-spacing: -.02em;
    color: var(--text);
    margin-bottom: 16px;
  }
  h1 span { color: var(--accent-2); }
  p { font-size: clamp(15px, 4vw, 17px); margin: 0 auto 32px; max-width: 42ch; }
  .acciones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    padding: 15px 24px;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: transform .25s cubic-bezier(.16, 1, .3, 1), background-color .25s, border-color .25s;
  }
  .btn:hover, .btn:focus-visible { transform: translateY(-2px); }
  .btn-full { background: var(--accent); color: #fff; }
  .btn-full:hover, .btn-full:focus-visible { background: #0a52ff; }
  .btn-line { border-color: var(--line); color: var(--text); }
  .btn-line:hover, .btn-line:focus-visible { border-color: var(--accent-2); background: var(--surface); }
  .btn svg { width: 19px; height: 19px; flex: none; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }
  footer { margin-top: 44px; font-size: 13px; color: var(--text-3); }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover, .btn:focus-visible { transform: none; }
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="/img/logo-negativo.png" alt="MJR Digital" width="1312" height="565" />
    <p class="code">Error 404</p>
    <h1>Esta página <span>no está.</span></h1>
    <p>El link que abriste no existe o cambió de lugar. Volvé al inicio, o escribime y te paso lo que estabas buscando.</p>
    <div class="acciones">
      <a class="btn btn-full" href="/">Ir al inicio</a>
      <a class="btn btn-line" href="https://wa.me/5491144091981?text=%C2%A1Hola!%20Entr%C3%A9%20a%20un%20link%20de%20tu%20web%20que%20no%20funciona" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2c-5.46 0-9.91 4.44-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.44 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm.01 1.8c2.17 0 4.2.85 5.73 2.38a8.07 8.07 0 0 1 2.38 5.73c0 4.48-3.64 8.12-8.11 8.12-1.42 0-2.82-.37-4.05-1.08l-.29-.17-3.12.82.83-3.04-.19-.31a8.1 8.1 0 0 1-1.24-4.34c0-4.47 3.64-8.11 8.11-8.11z"/></svg>
        Escribime por WhatsApp
      </a>
    </div>
    <footer>MJR Digital · Joel Rodriguez · Hudson, Buenos Aires</footer>
  </main>
</body>
</html>
