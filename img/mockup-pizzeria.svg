<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Fondo -->
  <rect width="600" height="400" fill="#1a1a2e"/>

  <!-- Header -->
  <rect width="600" height="56" fill="#16213e"/>
  <text x="32" y="36" font-family="Arial" font-weight="bold" font-size="20" fill="#e94560">🍕 La Napolitana</text>
  <text x="380" y="36" font-family="Arial" font-size="13" fill="#aaa">Menú</text>
  <text x="440" y="36" font-family="Arial" font-size="13" fill="#aaa">Nosotros</text>
  <text x="500" y="36" font-family="Arial" font-size="13" fill="#aaa">Contacto</text>

  <!-- Hero -->
  <rect x="0" y="56" width="600" height="180" fill="#0f3460"/>
  <rect x="0" y="56" width="600" height="180" fill="url(#heroGrad)"/>
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f3460" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <text x="32" y="115" font-family="Arial" font-weight="bold" font-size="32" fill="#fff">La mejor pizza</text>
  <text x="32" y="150" font-family="Arial" font-weight="bold" font-size="32" fill="#e94560">de Buenos Aires</text>
  <text x="32" y="182" font-family="Arial" font-size="14" fill="#ccc">Ingredientes frescos · Horno a leña · Delivery</text>
  <rect x="32" y="198" width="130" height="36" rx="18" fill="#e94560"/>
  <text x="97" y="221" font-family="Arial" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">Ver menú</text>

  <!-- Círculo decorativo pizza -->
  <circle cx="490" cy="146" r="90" fill="#e94560" opacity="0.15"/>
  <circle cx="490" cy="146" r="70" fill="#e94560" opacity="0.1"/>
  <text x="490" y="160" font-family="Arial" font-size="60" text-anchor="middle">🍕</text>

  <!-- Sección productos -->
  <rect x="0" y="236" width="600" height="164" fill="#16213e"/>
  <text x="300" y="268" font-family="Arial" font-weight="bold" font-size="16" fill="#fff" text-anchor="middle">Nuestras especialidades</text>

  <!-- Card 1 -->
  <rect x="24" y="280" width="168" height="100" rx="10" fill="#0f3460"/>
  <text x="108" y="318" font-family="Arial" font-size="28" text-anchor="middle">🍕</text>
  <text x="108" y="342" font-family="Arial" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">Napolitana</text>
  <text x="108" y="360" font-family="Arial" font-size="12" fill="#e94560" text-anchor="middle">$3.500</text>

  <!-- Card 2 -->
  <rect x="216" y="280" width="168" height="100" rx="10" fill="#0f3460"/>
  <text x="300" y="318" font-family="Arial" font-size="28" text-anchor="middle">🧀</text>
  <text x="300" y="342" font-family="Arial" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">Muzzarella</text>
  <text x="300" y="360" font-family="Arial" font-size="12" fill="#e94560" text-anchor="middle">$2.800</text>

  <!-- Card 3 -->
  <rect x="408" y="280" width="168" height="100" rx="10" fill="#0f3460"/>
  <text x="492" y="318" font-family="Arial" font-size="28" text-anchor="middle">🥩</text>
  <text x="492" y="342" font-family="Arial" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">Especial carne</text>
  <text x="492" y="360" font-family="Arial" font-size="12" fill="#e94560" text-anchor="middle">$4.200</text>
</svg>
