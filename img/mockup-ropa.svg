<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Fondo -->
  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Header -->
  <rect width="600" height="56" fill="#fff"/>
  <rect width="600" height="1" y="56" fill="#eee"/>
  <text x="32" y="36" font-family="Arial" font-weight="bold" font-size="20" fill="#111">NOVA <tspan fill="#c9a96e">Studio</tspan></text>
  <text x="350" y="36" font-family="Arial" font-size="13" fill="#555">Colecciones</text>
  <text x="430" y="36" font-family="Arial" font-size="13" fill="#555">Nosotras</text>
  <text x="500" y="36" font-family="Arial" font-size="13" fill="#555">Contacto</text>

  <!-- Hero -->
  <rect x="0" y="57" width="600" height="180" fill="#f5f0e8"/>
  <text x="52" y="120" font-family="Georgia" font-weight="bold" font-size="34" fill="#111">Moda que</text>
  <text x="52" y="158" font-family="Georgia" font-weight="bold" font-size="34" fill="#c9a96e">te define</text>
  <text x="52" y="190" font-family="Arial" font-size="13" fill="#777">Nueva colección otoño 2026 disponible</text>
  <rect x="52" y="205" width="140" height="36" rx="4" fill="#111"/>
  <text x="122" y="228" font-family="Arial" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">Ver colección</text>

  <!-- Imagen decorativa ropa -->
  <circle cx="470" cy="147" r="80" fill="#e8dcc8"/>
  <text x="470" y="165" font-family="Arial" font-size="70" text-anchor="middle">👗</text>

  <!-- Sección productos -->
  <rect x="0" y="237" width="600" height="163" fill="#fff"/>
  <text x="300" y="268" font-family="Georgia" font-weight="bold" font-size="16" fill="#111" text-anchor="middle">Destacados</text>

  <!-- Card 1 -->
  <rect x="24" y="280" width="168" height="100" rx="8" fill="#f5f0e8"/>
  <text x="108" y="318" font-family="Arial" font-size="28" text-anchor="middle">👗</text>
  <text x="108" y="342" font-family="Arial" font-weight="bold" font-size="12" fill="#111" text-anchor="middle">Vestido lino</text>
  <text x="108" y="360" font-family="Arial" font-size="12" fill="#c9a96e" text-anchor="middle">$28.000</text>

  <!-- Card 2 -->
  <rect x="216" y="280" width="168" height="100" rx="8" fill="#f5f0e8"/>
  <text x="300" y="318" font-family="Arial" font-size="28" text-anchor="middle">👚</text>
  <text x="300" y="342" font-family="Arial" font-weight="bold" font-size="12" fill="#111" text-anchor="middle">Remera oversize</text>
  <text x="300" y="360" font-family="Arial" font-size="12" fill="#c9a96e" text-anchor="middle">$14.000</text>

  <!-- Card 3 -->
  <rect x="408" y="280" width="168" height="100" rx="8" fill="#f5f0e8"/>
  <text x="492" y="318" font-family="Arial" font-size="28" text-anchor="middle">👖</text>
  <text x="492" y="342" font-family="Arial" font-weight="bold" font-size="12" fill="#111" text-anchor="middle">Jean tiro alto</text>
  <text x="492" y="360" font-family="Arial" font-size="12" fill="#c9a96e" text-anchor="middle">$32.000</text>
</svg>
