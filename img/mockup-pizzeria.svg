<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="heroP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0a00" stop-opacity="1"/>
      <stop offset="70%" stop-color="#1a0a00" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0a00" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="imgP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b3a00"/>
      <stop offset="100%" stop-color="#3d1a00"/>
    </linearGradient>
  </defs>

  <!-- Fondo general -->
  <rect width="800" height="520" fill="#fff"/>

  <!-- HEADER -->
  <rect width="800" height="68" fill="#1a0a00"/>
  <circle cx="42" cy="34" r="18" fill="#e85d04"/>
  <text x="42" y="40" font-family="Georgia" font-size="18" fill="#fff" text-anchor="middle">🍕</text>
  <text x="70" y="30" font-family="Georgia" font-weight="bold" font-size="16" fill="#fff">La</text>
  <text x="88" y="30" font-family="Georgia" font-weight="bold" font-size="16" fill="#e85d04">Napolitana</text>
  <text x="70" y="48" font-family="Arial" font-size="10" fill="#888">Pizzería · Buenos Aires</text>
  <text x="430" y="38" font-family="Arial" font-size="13" fill="#ccc">Inicio</text>
  <text x="480" y="38" font-family="Arial" font-size="13" fill="#ccc">Menú</text>
  <text x="524" y="38" font-family="Arial" font-size="13" fill="#ccc">Nosotros</text>
  <text x="584" y="38" font-family="Arial" font-size="13" fill="#ccc">Contacto</text>
  <rect x="648" y="18" width="124" height="34" rx="4" fill="#e85d04"/>
  <text x="710" y="40" font-family="Arial" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">📱 Hacer pedido</text>

  <!-- HERO - imagen fondo simulada -->
  <rect x="0" y="68" width="800" height="220" fill="url(#imgP)"/>
  <!-- Textura de pizza simulada con círculos -->
  <circle cx="650" cy="168" r="130" fill="#a04500" opacity="0.5"/>
  <circle cx="650" cy="168" r="100" fill="#c05500" opacity="0.4"/>
  <circle cx="650" cy="168" r="75" fill="#d06010" opacity="0.5"/>
  <circle cx="625" cy="148" r="12" fill="#8b0000" opacity="0.6"/>
  <circle cx="680" cy="175" r="9" fill="#8b0000" opacity="0.6"/>
  <circle cx="650" cy="200" r="11" fill="#228b22" opacity="0.5"/>
  <circle cx="700" cy="145" r="10" fill="#228b22" opacity="0.5"/>
  <text x="650" y="185" font-family="Arial" font-size="80" text-anchor="middle" opacity="0.7">🍕</text>
  <!-- Overlay gradiente -->
  <rect x="0" y="68" width="800" height="220" fill="url(#heroP)"/>
  <!-- Contenido hero -->
  <rect x="28" y="92" width="180" height="24" rx="12" fill="#e85d04" opacity="0.25"/>
  <text x="118" y="109" font-family="Arial" font-size="12" fill="#e85d04" font-weight="700" text-anchor="middle">🔥 Horno a leña desde 1998</text>
  <text x="28" y="156" font-family="Georgia" font-weight="bold" font-size="36" fill="#fff">La mejor pizza</text>
  <text x="28" y="196" font-family="Georgia" font-weight="bold" font-size="36" fill="#e85d04">de Buenos Aires</text>
  <text x="28" y="228" font-family="Arial" font-size="14" fill="#ccc">Ingredientes frescos · Masa artesanal · Delivery</text>
  <rect x="28" y="244" width="148" height="38" rx="4" fill="#e85d04"/>
  <text x="102" y="268" font-family="Arial" font-weight="700" font-size="14" fill="#fff" text-anchor="middle">Ver menú completo</text>
  <rect x="186" y="244" width="130" height="38" rx="4" fill="transparent" stroke="#fff" stroke-width="1.5"/>
  <text x="251" y="268" font-family="Arial" font-weight="600" font-size="13" fill="#fff" text-anchor="middle">Hacer reserva</text>

  <!-- SECCIÓN ESPECIALIDADES -->
  <rect x="0" y="288" width="800" height="232" fill="#fff"/>
  <text x="400" y="322" font-family="Georgia" font-weight="bold" font-size="22" fill="#1a0a00" text-anchor="middle">Nuestras especialidades</text>
  <line x1="340" y1="332" x2="460" y2="332" stroke="#e85d04" stroke-width="2"/>

  <!-- Card 1 -->
  <rect x="28" y="346" width="226" height="154" rx="10" fill="#fdf5f0" stroke="#f0e0d0" stroke-width="1"/>
  <rect x="28" y="346" width="226" height="90" rx="10 10 0 0" fill="#c05500" opacity="0.8"/>
  <text x="141" y="405" font-family="Arial" font-size="44" text-anchor="middle">🍕</text>
  <text x="141" y="456" font-family="Georgia" font-weight="bold" font-size="15" fill="#1a0a00" text-anchor="middle">Napolitana clásica</text>
  <text x="141" y="476" font-family="Arial" font-size="12" fill="#888" text-anchor="middle">Tomate · Muzzarella · Albahaca</text>
  <text x="141" y="494" font-family="Arial" font-weight="700" font-size="14" fill="#e85d04" text-anchor="middle">$3.500</text>

  <!-- Card 2 -->
  <rect x="286" y="346" width="226" height="154" rx="10" fill="#fdf5f0" stroke="#f0e0d0" stroke-width="1"/>
  <rect x="286" y="346" width="226" height="90" rx="10 10 0 0" fill="#a04500" opacity="0.8"/>
  <text x="399" y="405" font-family="Arial" font-size="44" text-anchor="middle">🧀</text>
  <text x="399" y="456" font-family="Georgia" font-weight="bold" font-size="15" fill="#1a0a00" text-anchor="middle">Fugazzeta rellena</text>
  <text x="399" y="476" font-family="Arial" font-size="12" fill="#888" text-anchor="middle">Cebolla · Doble muzzarella</text>
  <text x="399" y="494" font-family="Arial" font-weight="700" font-size="14" fill="#e85d04" text-anchor="middle">$4.200</text>

  <!-- Card 3 -->
  <rect x="544" y="346" width="226" height="154" rx="10" fill="#fdf5f0" stroke="#f0e0d0" stroke-width="1"/>
  <rect x="544" y="346" width="226" height="90" rx="10 10 0 0" fill="#8b3a00" opacity="0.8"/>
  <text x="657" y="405" font-family="Arial" font-size="44" text-anchor="middle">🥩</text>
  <text x="657" y="456" font-family="Georgia" font-weight="bold" font-size="15" fill="#1a0a00" text-anchor="middle">Especial carne</text>
  <text x="657" y="476" font-family="Arial" font-size="12" fill="#888" text-anchor="middle">Carne · Morrones · Cebolla</text>
  <text x="657" y="494" font-family="Arial" font-weight="700" font-size="14" fill="#e85d04" text-anchor="middle">$4.800</text>
</svg>
