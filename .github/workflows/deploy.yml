# Publica la web de MJR Digital.
#
# GitHub Pages está configurado como "Deploy from a branch" y publica la raíz
# de master tal cual, así que la raíz tiene que tener el sitio ya construido.
# Este workflow lo hace solo: construye, commitea el resultado si cambió y
# además deja el artefacto publicado por la vía de Actions. De las dos formas
# se sirve exactamente lo mismo, así que no importa cuál gane.
#
# Resultado práctico: alcanza con pushear el código fuente. No hay que
# acordarse de correr `npm run publicar` a mano.
#
# CUANDO PAGES PASE A "GitHub Actions" (Settings → Pages → Source):
#   - se puede borrar el job "construir" entero menos el build y el upload
#   - se puede borrar de la raíz index.html, assets/, img/, demo-stock/,
#     robots.txt, sitemap.xml, más _config.yml y scripts/publicar.mjs
#   Está explicado en docs/DESPLIEGUE.md.
name: Publicar el sitio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Si entran dos pushes seguidos, se publica el último y no se corta
# un despliegue a medio camino.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio sobre la raíz
        run: npm run publicar

      - name: Commitear el sitio si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets img demo-stock robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "El sitio publicado ya estaba al día."
          else
            git commit -m "Reconstruir el sitio publicado [auto]"
            git push
          fi

      - name: Build para el artefacto de Pages
        run: npm run build

      - name: Subir el artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
