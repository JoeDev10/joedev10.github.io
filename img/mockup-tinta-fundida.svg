<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Mockup del sitio de Tinta Fundida, taller de impresión 3D">
  <defs>
    <linearGradient id="tf-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1a18"/>
      <stop offset="100%" stop-color="#26231f"/>
    </linearGradient>
    <linearGradient id="tf-fil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a29"/>
      <stop offset="100%" stop-color="#ffb648"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" fill="#141311"/>

  <!-- HEADER -->
  <rect width="800" height="58" fill="#1b1a18"/>
  <rect x="28" y="18" width="22" height="22" rx="3" fill="url(#tf-fil)"/>
  <text x="60" y="35" font-family="Georgia, serif" font-weight="700" font-size="16" fill="#f5f1ea">Tinta <tspan fill="#ff7a29">Fundida</tspan></text>
  <text x="452" y="34" font-family="Arial" font-size="12" fill="#8b8378">Servicios</text>
  <text x="516" y="34" font-family="Arial" font-size="12" fill="#8b8378">Catálogo</text>
  <text x="578" y="34" font-family="Arial" font-size="12" fill="#8b8378">Cómo pedir</text>
  <rect x="654" y="16" width="116" height="26" rx="2" fill="#25d366"/>
  <text x="712" y="33" font-family="Arial" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">Pedir por WhatsApp</text>

  <!-- HERO -->
  <rect x="0" y="58" width="800" height="196" fill="url(#tf-hero)"/>
  <!-- filamento decorativo -->
  <path d="M470 250 C 560 190, 600 130, 700 96" stroke="url(#tf-fil)" stroke-width="3" fill="none" opacity=".55"/>
  <path d="M470 262 C 570 210, 620 150, 730 118" stroke="url(#tf-fil)" stroke-width="3" fill="none" opacity=".3"/>
  <!-- pieza impresa: cubo isométrico por capas -->
  <g opacity=".95">
    <polygon points="628,100 700,140 628,180 556,140" fill="#ff7a29" opacity=".9"/>
    <polygon points="556,140 628,180 628,214 556,174" fill="#c4551a"/>
    <polygon points="700,140 628,180 628,214 700,174" fill="#e0691f"/>
    <line x1="556" y1="152" x2="628" y2="192" stroke="#141311" stroke-width="1" opacity=".35"/>
    <line x1="556" y1="163" x2="628" y2="203" stroke="#141311" stroke-width="1" opacity=".35"/>
    <line x1="700" y1="152" x2="628" y2="192" stroke="#141311" stroke-width="1" opacity=".35"/>
    <line x1="700" y1="163" x2="628" y2="203" stroke="#141311" stroke-width="1" opacity=".35"/>
  </g>

  <text x="28" y="104" font-family="Arial" font-size="10" fill="#ff7a29" letter-spacing="2.4">TALLER DE IMPRESIÓN 3D</text>
  <text x="28" y="146" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#f5f1ea">Lo que imaginás,</text>
  <text x="28" y="182" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#ff7a29">impreso en 3D</text>
  <text x="28" y="210" font-family="Arial" font-size="12.5" fill="#8b8378">Piezas del catálogo o diseños a medida · Elegís el color</text>
  <rect x="28" y="224" width="142" height="34" rx="2" fill="#ff7a29"/>
  <text x="99" y="246" font-family="Arial" font-weight="700" font-size="12" fill="#141311" text-anchor="middle">Ver catálogo →</text>

  <!-- BARRA DE COLORES -->
  <rect x="0" y="254" width="800" height="44" fill="#1b1a18"/>
  <text x="28" y="281" font-family="Arial" font-size="11" fill="#8b8378">Color:</text>
  <circle cx="82" cy="277" r="9" fill="#ff7a29" stroke="#f5f1ea" stroke-width="1.5"/>
  <circle cx="110" cy="277" r="9" fill="#2f9e44"/>
  <circle cx="138" cy="277" r="9" fill="#3b7dd8"/>
  <circle cx="166" cy="277" r="9" fill="#f5f1ea"/>
  <circle cx="194" cy="277" r="9" fill="#4a4540"/>
  <text x="640" y="281" font-family="Arial" font-size="11" fill="#8b8378">Tocá una pieza para consultarla</text>

  <!-- GRID DE PIEZAS -->
  <g>
    <rect x="28" y="318" width="176" height="170" fill="#1f1d1a"/>
    <g transform="translate(116,382)" opacity=".9">
      <polygon points="0,-26 30,-9 0,8 -30,-9" fill="#ff7a29"/>
      <polygon points="-30,-9 0,8 0,30 -30,13" fill="#c4551a"/>
      <polygon points="30,-9 0,8 0,30 30,13" fill="#e0691f"/>
    </g>
    <text x="44" y="452" font-family="Arial" font-weight="700" font-size="12" fill="#f5f1ea">Maceta hexagonal</text>
    <text x="44" y="470" font-family="Arial" font-size="11" fill="#ff7a29">Consultar</text>
  </g>
  <g>
    <rect x="216" y="318" width="176" height="170" fill="#1f1d1a"/>
    <g transform="translate(304,382)" opacity=".9">
      <circle cx="0" cy="-4" r="26" fill="none" stroke="#ff7a29" stroke-width="7"/>
      <circle cx="0" cy="-4" r="12" fill="#c4551a"/>
    </g>
    <text x="232" y="452" font-family="Arial" font-weight="700" font-size="12" fill="#f5f1ea">Soporte de auriculares</text>
    <text x="232" y="470" font-family="Arial" font-size="11" fill="#ff7a29">Consultar</text>
  </g>
  <g>
    <rect x="404" y="318" width="176" height="170" fill="#1f1d1a"/>
    <g transform="translate(492,382)" opacity=".9">
      <rect x="-28" y="-26" width="56" height="52" rx="3" fill="none" stroke="#ff7a29" stroke-width="6"/>
      <line x1="-28" y1="-8" x2="28" y2="-8" stroke="#c4551a" stroke-width="5"/>
    </g>
    <text x="420" y="452" font-family="Arial" font-weight="700" font-size="12" fill="#f5f1ea">Organizador de escritorio</text>
    <text x="420" y="470" font-family="Arial" font-size="11" fill="#ff7a29">Consultar</text>
  </g>
  <g>
    <rect x="592" y="318" width="176" height="170" fill="#1f1d1a" stroke="#ff7a29" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="680" y="378" font-family="Georgia, serif" font-size="30" fill="#ff7a29" text-anchor="middle">+</text>
    <text x="680" y="408" font-family="Arial" font-weight="700" font-size="12" fill="#f5f1ea" text-anchor="middle">Diseño a medida</text>
    <text x="680" y="428" font-family="Arial" font-size="11" fill="#8b8378" text-anchor="middle">Mandanos tu idea</text>
    <rect x="622" y="444" width="116" height="28" rx="2" fill="#25d366"/>
    <text x="680" y="463" font-family="Arial" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">Consultar</text>
  </g>
</svg>
