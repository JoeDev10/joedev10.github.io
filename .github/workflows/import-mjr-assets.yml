name: Import MJR assets
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode assets, commit redesign, and remove import helpers
        run: |
          set -euo pipefail
          test -f tmp-mjr-import/payload.tar.b64
          base64 -d tmp-mjr-import/payload.tar.b64 | tar -xvf -
          rm -rf tmp-mjr-import
          rm -f .github/workflows/import-mjr-assets.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html estilos.css \
            img/favicon-32.png img/favicon-192.png img/apple-touch.png \
            img/isologo-negativo.png img/isologo-original.png \
            img/logo-negativo.png img/logo-original.png img/og-mjr-digital.jpg
          git add -u -- tmp-mjr-import .github/workflows/import-mjr-assets.yml .github/workflows .github || true
          git status
          git commit -m "Rediseño MJR Digital: automatizaciones con IA, agente de WhatsApp, manual de marca"
          git push
